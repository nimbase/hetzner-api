# NimbaseBot workflow
#
# The Hetzner Cloud client is a single package living at the repo root and is
# generated from the upstream apis.guru spec (no local specs/ dir). This workflow
# regenerates it from the upstream spec on a nightly schedule (or manually),
# then runs the test suite, auto-bumps the version, commits, tags and releases.
# If the tests fail, the bot files a GitHub issue and releases nothing.
#
# Setup:
#   1. Works out of the box with GITHUB_TOKEN (no secrets needed). Optionally
#      add a bot PAT as `BOT_TOKEN` so the bot's pushes re-trigger the dependent
#      test/docs workflows.
#   2. Ensure an initial tag exists matching the root hetzner.nimble version.

name: nimbase

on:
  push:
    branches: [main]
    paths:
      - 'hetzner.nimble'
      - 'nimbase.oapi.config.yaml'
      - '.github/workflows/nimbase.yml'
  schedule:
    - cron: '0 3 * * *'   # nightly re-check for upstream spec changes
  workflow_dispatch:

concurrency:
  group: nimbase
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write    # needed for GITHUB_TOKEN to file test-failure issues
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nimbase/nimbase-bot@v1
        with:
          # token is optional; defaults to GITHUB_TOKEN. Pass secrets.BOT_TOKEN
          # to re-trigger dependent test/docs workflows.
          test: 'true'
          # Generate the client into a temp dir and copy the generated sources
          # over the repo root. hetzner.nimble is left untouched so the patch
          # bump keeps progressing across releases.
          gen-command: |
            tmp="$(mktemp -d)"
            nimbase oapi.gurugen "hetzner.cloud" "$tmp/hetzner"
            cp -R "$tmp/hetzner/src" .
            cp -R "$tmp/hetzner/tests" .
            rm -rf "$tmp"
