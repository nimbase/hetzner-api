# NimbaseBot workflow
#
# The Hetzner Cloud client is a single package living at the repo root and is
# generated from the upstream apis.guru spec (no local specs/ dir). On a nightly
# schedule the bot first checks whether the upstream spec changed (via
# `nimbase oapi.diff`, comparing against the committed specs/hetzner.cloud.json)
# and only regenerates, bumps the version, commits, tags and releases when it
# did. test.yml/docs.yml re-run via their own `workflow_run` trigger after this
# workflow completes.
#
# Setup:
#   1. No secrets needed — the bot pushes with the per-run GITHUB_TOKEN.
#   2. Ensure an initial tag exists matching the root hetzner.nimble version.

name: nimbase

on:
  push:
    branches: [main]
    paths:
      - 'hetzner.nimble'
      - 'specs/**'
      - 'nimbase.oapi.config.yaml'
      - '.github/workflows/nimbase.yml'
  schedule:
    - cron: '0 3 * * *'   # nightly re-check for upstream spec changes
  workflow_dispatch:

concurrency:
  group: nimbase
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: nimbase/nimbase-bot@v1
        with:
          spec-source: hetzner.cloud
          spec-file: specs/hetzner.cloud.json
          # Generate the client into a temp dir and copy the generated sources
          # over the repo root. hetzner.nimble is left untouched so the version
          # bump keeps progressing across releases. --save-spec refreshes the
          # committed baseline spec that oapi.diff compares against.
          gen-command: |
            mkdir -p specs
            tmp="$(mktemp -d)"
            nimbase oapi.gurugen "hetzner.cloud" "$tmp/hetzner" --save-spec:specs/hetzner.cloud.json
            cp -R "$tmp/hetzner/src" .
            cp -R "$tmp/hetzner/tests" .
            rm -rf "$tmp"
